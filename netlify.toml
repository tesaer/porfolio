[build]
  command = "npm install"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Route /api/content directly to the serverless function
[[redirects]]
  from = "/api/content"
  to = "/.netlify/functions/content"
  status = 200

# Security headers & MIME
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
